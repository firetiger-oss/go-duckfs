name: Update DuckDB

on:
  schedule:
    - cron: "0 0 * * *" # Daily at 00:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: "DuckDB version (e.g., v1.5.0). Leave empty to use latest release."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: blacksmith-16vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine target version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(gh api repos/duckdb/duckdb/releases/latest --jq '.tag_name')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Target version: $VERSION"

      - name: Check if version already exists
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Check if branch exists
          if git ls-remote --heads origin "$VERSION" | grep -q "$VERSION"; then
            echo "Branch $VERSION already exists"
            echo "exists=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if directory exists
          if [ -d "duckdb/$VERSION" ]; then
            echo "Directory duckdb/$VERSION already exists"
            echo "exists=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "exists=false" >> $GITHUB_OUTPUT

      - name: Create version branch
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git checkout -b "$VERSION"

      - name: Clone DuckDB at release tag
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git clone --depth 1 --branch "$VERSION" https://github.com/duckdb/duckdb.git duckdb-src

      - name: Copy header files
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p "duckdb/$VERSION/src/include"
          cp -r duckdb-src/src/include/* "duckdb/$VERSION/src/include/"
          rm -rf duckdb-src

      - name: Update pixi.toml
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Strip leading 'v' for pixi version
          PIXI_VERSION="${VERSION#v}"
          sed -i "s/libduckdb = \"==[^\"]*\"/libduckdb = \"==$PIXI_VERSION\"/" pixi.toml
          echo "Updated pixi.toml to libduckdb version $PIXI_VERSION"

      - name: Commit and push
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add duckdb/"$VERSION" pixi.toml
          git commit -m "update duckdb to $VERSION"
          git push origin "$VERSION"

      - name: Create Pull Request
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh pr create \
            --title "Update DuckDB to $VERSION" \
            --body "This PR updates DuckDB to version $VERSION.

          Changes:
          - Added header files in \`duckdb/$VERSION/src/include/\`
          - Updated \`pixi.toml\` to use libduckdb ${VERSION#v}

          Auto-generated by the update-duckdb workflow." \
            --base main \
            --head "$VERSION"
